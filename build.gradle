plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.116'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id + "-" + project.minecraft_version + "-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }
    client { systemProperty 'forge.enabledGameTestNamespaces', project.mod_id }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
    gameTestServer { systemProperty 'forge.enabledGameTestNamespaces', project.mod_id }
    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(), '--existing',
                file('src/main/resources/').getAbsolutePath()
    }
}
sourceSets.main.resources {
srcDir('src/generated/resources')
srcDir('src/main/templates')
exclude("**/*.bbmodel")
exclude("src/generated/**/.cache")
}
dependencies { implementation 'net.neoforged:neoforge:' + neo_version }
tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version:minecraft_version, minecraft_version_range:minecraft_version_range,
        neo_version:neo_version, neo_version_range:neo_version_range,
        forge_version_range:neo_version_range, loader_version_range:loader_version_range,
        mod_id:mod_id, mod_name:mod_name, mod_license:mod_license,
        mod_version:mod_version, mod_authors:mod_authors,
        mod_description:mod_description
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
