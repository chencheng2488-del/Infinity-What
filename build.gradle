plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id + "-" + project.minecraft_version + "-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_toolchain_version as int)
sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}
neoForge {
    version = project.neo_version
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        gameTestServer { type = "gameTestServer"; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id,
                    '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(),
                    '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { infwhat { sourceSet(sourceSets.main) } }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
        minecraft_version:minecraft_version, minecraft_version_range:minecraft_version_range,
        neo_version:neo_version, neo_version_range:neo_version_range,
        forge_version_range:neo_version_range, loader_version_range:loader_version_range,
        mod_id:mod_id, mod_name:mod_name, mod_license:mod_license,
        mod_version:mod_version, mod_authors:mod_authors, mod_description:mod_description
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }