buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1.2'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '2.0.0b'
group = 'com.bandybus.infwhat'
archivesBaseName = 'infwhat-1.8.9-forge'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_20"
}

dependencies {
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "infwhat",
                "Specification-Vendor"    : "bandybus",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "bandybus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
