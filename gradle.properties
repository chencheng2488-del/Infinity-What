# JVM settings for ForgeGradle 2 / Gradle 4.10.2. The 1.8.9 toolchain must run on Java 8.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.home=D:\\Java\\jdk8u504-b01

